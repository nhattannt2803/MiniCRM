server {
    listen 80;
    server_name your_domain_or_ip; # Thay thế bằng IP public của VPS hoặc tên miền của bạn

    root /var/www/minicrm/client/dist;
    index index.html;

    # Phục vụ file tĩnh của Frontend React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Chuyển tiếp các API request đến Express Backend chạy ở cổng 5000
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Health Check (Tùy chọn)
    location /health {
        proxy_pass http://127.0.0.1:5000/health;
        proxy_set_header Host $host;
    }

    # Log files
    access_log /var/log/nginx/minicrm_access.log;
    error_log /var/log/nginx/minicrm_error.log;
}
